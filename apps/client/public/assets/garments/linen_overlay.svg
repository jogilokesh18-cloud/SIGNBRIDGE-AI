<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <!-- Jacquemus Riviera Linen Shirt Haute Couture Try-On Overlay -->
